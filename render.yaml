services:
  - type: web
    name: rabis-kyc-screening
    runtime: docker
    plan: free
    dockerfilePath: ./services/kyc-screening/Dockerfile
    dockerContext: ./services/kyc-screening
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: SCREENING_SHARED_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: MAX_IMAGE_BYTES
        value: "4194304"
      - key: MAX_VIDEO_BYTES
        value: "20971520"
      - key: MAX_DOWNLOAD_SECONDS
        value: "12"
