name: Feature request
description: Suggest an improvement for Rabi's Saving Hub
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Registration / KYC
        - Payments / MoMo
        - Susu rounds
        - Admin panel
        - Marketing site
        - Other
