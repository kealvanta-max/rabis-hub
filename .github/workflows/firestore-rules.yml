name: Firestore rules

# Rules only protect the database once somebody deploys them, and a green tick
# that deployed nothing is worse than a red one. If this workflow cannot publish
# firestore.rules it fails, on purpose, and says exactly what to do.
#
# This is separate from the app pipeline on purpose: a missing deploy token must
# never block an application build from shipping.

on:
  push:
    branches: [ "main" ]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Refuse to report success when nothing was deployed
        if: ${{ env.FIREBASE_TOKEN == '' }}
        run: |
          echo "::error::firestore.rules was NOT deployed: the FIREBASE_TOKEN secret is missing."
          echo "Until it exists, the live database keeps whatever rules it had before."
          echo ""
          echo "Fix it in one of two ways:"
          echo "  1. On a laptop, from the repository root: npm run rules:deploy"
          echo "  2. Generate a CI token with: npx --yes firebase-tools@13 login:ci"
          echo "     Add it as the repository secret FIREBASE_TOKEN, then re-run this job."
          echo ""
          echo "Then confirm the result as the owner at /api/security/rules-probe."
          exit 1

      - name: Deploy firestore.rules
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project rabi-hub --token "$FIREBASE_TOKEN" --non-interactive
